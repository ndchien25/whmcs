services:
  # ===========================================
  # WHMCS Application (Apache + PHP 8.2)
  # ===========================================
  whmcs:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: whmcs-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - whmcs_templates_c:/var/www/html/templates_c
      - whmcs_attachments:/var/www/html/attachments
      - whmcs_downloads:/var/www/html/downloads
      - mitmproxy_certs:/mitmproxy-certs:ro
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
      - http_proxy=http://mitmproxy:8888
      - https_proxy=http://mitmproxy:8888
      - HTTP_PROXY=http://mitmproxy:8888
      - HTTPS_PROXY=http://mitmproxy:8888
      - no_proxy=db,localhost,127.0.0.1,whmcs-db,mitmproxy
      - NO_PROXY=db,localhost,127.0.0.1,whmcs-db,mitmproxy
    depends_on:
      db:
        condition: service_healthy
      mitmproxy:
        condition: service_started
    networks:
      - whmcs-network

  # ===========================================
  # MySQL 8.0 Database
  # ===========================================
  db:
    image: mysql:8.0
    container_name: whmcs-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: whmcs_root_pass
      MYSQL_DATABASE: whmcs
      MYSQL_USER: whmcs
      MYSQL_PASSWORD: whmcs_pass
    volumes:
      - whmcs_db_data:/var/lib/mysql
      - ./docker/mysql.cnf:/etc/mysql/conf.d/whmcs.cnf
      - ./logs/mysql:/var/log/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --general-log=ON
      --general-log-file=/var/log/mysql/general.log
      --log-output=FILE
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pwhmcs_root_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - whmcs-network

  # ===========================================
  # phpMyAdmin (Optional - Database Management)
  # ===========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: whmcs-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: whmcs_root_pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - whmcs-network

  # ===========================================
  # Mailpit (Email Testing - catches all mail)
  # ===========================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: whmcs-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - whmcs-network

  # ===========================================
  # mitmproxy (API Traffic Logger)
  # ===========================================
  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: whmcs-mitmproxy
    restart: unless-stopped
    command: >
      mitmdump
      --set block_global=false
      --listen-host 0.0.0.0
      --listen-port 8888
      --set ssl_insecure=true
      -s /scripts/mitmproxy-logger.py
    ports:
      - "8082:8888"
    volumes:
      - ./docker/mitmproxy-logger.py:/scripts/mitmproxy-logger.py:ro
      - ./docker/mitmproxy-overrides:/etc/mitmproxy/enom-overrides:ro
      - ./logs:/var/log/mitmproxy
      - mitmproxy_certs:/home/mitmproxy/.mitmproxy
    networks:
      - whmcs-network

volumes:
  whmcs_db_data:
    driver: local
  whmcs_templates_c:
    driver: local
  whmcs_attachments:
    driver: local
  whmcs_downloads:
    driver: local
  mitmproxy_certs:
    driver: local

networks:
  whmcs-network:
    driver: bridge
